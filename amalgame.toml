# Package manifest — amalgame-audio
#
# Audio synthesis, playback and capture for Amalgame, built on
# David Reid's public-domain miniaudio single-header library.
# miniaudio abstracts the OS-native audio APIs behind a single
# API (WASAPI on Windows, Core Audio on macOS, ALSA/PulseAudio
# on Linux). Vendored at runtime/vendor/miniaudio.h — no
# external dep at link time.
#
# Surface (v0.1):
#   Synthesis:    GenSine / GenSquare / GenTriangle /
#                 GenNoise / GenSilence
#   Transform:    ApplyEnvelope / Scale / Mix / Echo
#   IO:           SaveAsWav / LoadWav / Play
#   Diag:         LastError
#
# Sample format: 16-bit signed PCM mono. Multi-channel + 32-bit
# float pipelines are v0.6+.
#
# Surface (v0.2 additions):
#   Multi-format load:  Load / LoadMp3 / LoadFlac / LoadOgg
#   Sondes:             SampleRateOf / ChannelCountOf / DurationMsOf
#
# Surface (v0.3 additions):
#   Capture:    Record (blocking) / RecordStart / RecordStop /
#               RecordIsActive / RecordSampleCount
#
# Surface (v0.4 additions):
#   Streaming playback:  PlayStart / PlayPause / PlayResume /
#                        PlayStop / PlayIsActive / PlayIsPaused /
#                        PlaySampleCount
#
# Surface (v0.5 additions):
#   Live mixer:  MixerStart / MixerAddSource / MixerSetGain /
#                MixerSetPaused / MixerRemoveSource /
#                MixerSourceCount / MixerStop
#
# Surface (v0.6 additions):
#   MIDI:  MidiLoadSmf / MidiSaveSmf / MidiRenderToAudio /
#          MidiLastTicksPerQuarter / MidiLastTempo
#         (SMF file IO + render-to-audio via internal sine
#          synth. MIDI device IO — live keyboards / hardware
#          synths — deferred to v0.8+.)
#
# Surface (v0.7 additions):
#   Stereo helpers:  MonoToStereo / StereoToMono /
#                    SaveAsWavStereo / LoadWavStereo
#                    (interleaved int16 LR layout)
#   MidiRenderToAudio polish:
#     - per-note attack envelope (5 ms ramp)   — no click on NoteOn
#     - per-note release envelope (30 ms ramp) — no click on NoteOff
#     - pitch-bend rendering, ±2 semitones (GM default)
#
# Out of scope (v0.8+):
#   - MIDI device IO (live keyboards, hardware synths) —
#     needs portable cross-platform wrapper (ALSA seq on
#     Linux, CoreMIDI on macOS, winmm on Windows)
#   - Real-time synthesis via user-provided callback
#   - Pitch shift / time stretch / FFT analysis
#   - Spatial audio / HRTF (mixer is mono, no panning yet)
#   - Multi-channel pipelines (surround / 32-bit float)
#   - MIDI render: CC / ProgramChange / ChanPressure / poly-
#     aftertouch (accepted on read, ignored by the synth)
#
# Installation:
#
#   amc package add audio                                # via index
#   amc package add github.com/amalgame-lang/amalgame-audio@v0.7.0

[package]
name              = "amalgame-audio"
version           = "0.7.0"
license           = "Apache-2.0"
description       = "Audio synth + streaming playback + capture + live mixer + multi-format decode + MIDI SMF (render w/ envelope + pitch-bend) + stereo helpers for Amalgame — miniaudio (public domain), vendored."
authors           = ["Bastien Mouget"]
required-amalgame = ">=0.5.4"
schema-version    = 1

[stdlib]
class     = "Audio"
header    = "runtime/Amalgame_Audio.h"
namespace = "Amalgame.Audio"

# miniaudio implementation, materialised in one TU.
# Precompiled once at `amc package add` time; reused across
# every subsequent build via the platform-keyed cache.
# v0.2: MP3/FLAC/Vorbis decoders now enabled (.o grows from
# ~250 KB → ~1 MB).
sources    = ["runtime/vendor/ma_impl.c"]
precompile = true

# miniaudio is a single, large header; -O2 keeps decode/encode
# hot paths tight. -w stays under amc's own quieter flag.
cflags     = "-O2"

# Platform link flags — miniaudio defers to OS-native libs at
# runtime. amc forwards these to the user's gcc invocation.
libs       = ["m", "dl", "pthread"]

[stdlib.functions]
GenSine        = { returns = "AmalgameList*" }
GenSquare      = { returns = "AmalgameList*" }
GenTriangle    = { returns = "AmalgameList*" }
GenNoise       = { returns = "AmalgameList*" }
GenSilence     = { returns = "AmalgameList*" }
ApplyEnvelope  = { returns = "AmalgameList*" }
Scale          = { returns = "AmalgameList*" }
Mix            = { returns = "AmalgameList*" }
Echo           = { returns = "AmalgameList*" }
SaveAsWav      = { returns = "code_bool" }
LoadWav        = { returns = "AmalgameList*" }
Play           = { returns = "code_bool" }
LastError      = { returns = "code_string" }

# v0.2 — multi-format decoders + sondes
Load             = { returns = "AmalgameList*" }
LoadMp3          = { returns = "AmalgameList*" }
LoadFlac         = { returns = "AmalgameList*" }
LoadOgg          = { returns = "AmalgameList*" }
SampleRateOf     = { returns = "i64" }
ChannelCountOf   = { returns = "i64" }
DurationMsOf     = { returns = "i64" }

# v0.3 — mic capture
Record             = { returns = "AmalgameList*" }
RecordStart        = { returns = "AmalgameAudioRec*" }
RecordStop         = { returns = "AmalgameList*" }
RecordIsActive     = { returns = "code_bool" }
RecordSampleCount  = { returns = "i64" }

# v0.4 — streaming playback (Pause / Resume / Stop)
PlayStart          = { returns = "AmalgameAudioPlay*" }
PlayPause          = { returns = "code_bool" }
PlayResume         = { returns = "code_bool" }
PlayStop           = { returns = "code_bool" }
PlayIsActive       = { returns = "code_bool" }
PlayIsPaused       = { returns = "code_bool" }
PlaySampleCount    = { returns = "i64" }

# v0.5 — live AudioMixer (multi-source streaming)
MixerStart         = { returns = "AmalgameAudioMixer*" }
MixerAddSource     = { returns = "i64" }
MixerSetGain       = { returns = "code_bool" }
MixerSetPaused     = { returns = "code_bool" }
MixerRemoveSource  = { returns = "code_bool" }
MixerSourceCount   = { returns = "i64" }
MixerStop          = { returns = "code_bool" }

# v0.6 — MIDI (Standard MIDI File IO + render to audio)
MidiLoadSmf              = { returns = "AmalgameList*" }
MidiSaveSmf              = { returns = "code_bool" }
MidiRenderToAudio        = { returns = "AmalgameList*" }
MidiLastTicksPerQuarter  = { returns = "i64" }
MidiLastTempo            = { returns = "i64" }

# v0.7 — stereo helpers (MidiRenderToAudio also gains envelope
# + pitch-bend rendering — same signature, no new method)
MonoToStereo       = { returns = "AmalgameList*" }
StereoToMono       = { returns = "AmalgameList*" }
SaveAsWavStereo    = { returns = "code_bool" }
LoadWavStereo      = { returns = "AmalgameList*" }

[dependencies]
